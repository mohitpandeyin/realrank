<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">RealRank Ranked Lens responsive logo system</title>
  <desc id="desc">A logo specimen showing the primary mark, monochrome mark, small-size tests, and navbar lockups.</desc>
  <defs>
    <g id="mark">
      <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="6"/>
      <path d="M40 40 58 58" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <path fill="#C65D2E" d="M12 36V18.5a3.5 3.5 0 0 1 3.5-3.5H21v21H12Z"/>
      <path fill="currentColor" d="M23 36V23.5a3.5 3.5 0 0 1 3.5-3.5H32v16h-9Zm10 0v-7a3 3 0 0 1 3-3h4.5v10H33Z"/>
    </g>
    <g id="mark-mono">
      <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="6"/>
      <path d="M40 40 58 58" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <path fill="currentColor" d="M12 36V18.5a3.5 3.5 0 0 1 3.5-3.5H21v21H12Zm11 0V23.5a3.5 3.5 0 0 1 3.5-3.5H32v16h-9Zm10 0v-7a3 3 0 0 1 3-3h4.5v10H33Z"/>
    </g>
  </defs>
  <rect width="1280" height="760" fill="#F7F5F0"/>
  <text x="72" y="82" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">RealRank — Ranked Lens</text>
  <text x="72" y="124" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="20">One responsive mark: discovery, property, and visible rank.</text>

  <g transform="translate(72 178)">
    <rect width="430" height="340" rx="28" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <text x="28" y="45" fill="#C65D2E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRIMARY MARK</text>
    <g transform="translate(108 70) scale(3.3)" color="#0F3D2E"><use href="#mark"/></g>
    <text x="28" y="308" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="16">Lens · ranked property blocks · first-place accent</text>
  </g>

  <g transform="translate(534 178)">
    <rect width="674" height="160" rx="28" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <text x="28" y="42" fill="#C65D2E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">RESPONSIVE SIZE TEST</text>
    <g transform="translate(34 67)" color="#0F3D2E"><use href="#mark" transform="scale(1.2)"/></g>
    <text x="112" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">64</text>
    <g transform="translate(172 79)" color="#0F3D2E"><use href="#mark" transform="scale(.75)"/></g>
    <text x="225" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">48</text>
    <g transform="translate(285 87)" color="#0F3D2E"><use href="#mark" transform="scale(.5)"/></g>
    <text x="324" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">32</text>
    <g transform="translate(388 91)" color="#0F3D2E"><use href="#mark" transform="scale(.375)"/></g>
    <text x="420" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">24</text>
    <g transform="translate(482 95)" color="#0F3D2E"><use href="#mark" transform="scale(.25)"/></g>
    <text x="507" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">16 px</text>
    <g transform="translate(585 82)" color="#0F3D2E"><use href="#mark-mono" transform="scale(.625)"/></g>
    <text x="625" y="105" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">mono</text>
  </g>

  <g transform="translate(534 370)">
    <rect width="674" height="148" rx="28" fill="#0F3D2E"/>
    <g transform="translate(36 38) scale(1.15)" color="#F7F5F0">
      <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="6"/>
      <path d="M40 40 58 58" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <path fill="#C65D2E" d="M12 36V18.5a3.5 3.5 0 0 1 3.5-3.5H21v21H12Z"/>
      <path fill="currentColor" d="M23 36V23.5a3.5 3.5 0 0 1 3.5-3.5H32v16h-9Zm10 0v-7a3 3 0 0 1 3-3h4.5v10H33Z"/>
    </g>
    <text x="128" y="91" fill="#F7F5F0" font-family="Inter, Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.5">RealRank</text>
    <text x="344" y="88" fill="#D8E4DF" font-family="Inter, Arial, sans-serif" font-size="18">The transparent real estate index.</text>
  </g>

  <g transform="translate(72 560)">
    <rect width="1136" height="126" rx="24" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <g transform="translate(30 31)" color="#0F3D2E"><use href="#mark" transform="scale(1)"/></g>
    <text x="106" y="76" fill="#0F3D2E" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1">RealRank</text>
    <line x1="292" y1="30" x2="292" y2="96" stroke="#E5E0D5" stroke-width="2"/>
    <text x="326" y="56" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650">Navbar lockup</text>
    <text x="326" y="82" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="15">Compact optical weight with a single restrained accent.</text>
    <g transform="translate(1000 34)">
      <rect width="58" height="58" rx="13" fill="#F7F5F0"/>
      <g transform="translate(7 7) scale(.68)" color="#0F3D2E"><use href="#mark"/></g>
    </g>
    <text x="1070" y="68" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">app</text>
  </g>
  <text x="72" y="728" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">Geometry: 64 × 64 master grid · two colors · no interior detail below the three rank blocks</text>
</svg>
