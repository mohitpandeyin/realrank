<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RealRank index and real estate icon concepts</title>
  <desc id="desc">Three vector logo concepts combining an index with real estate: Ranked Address, Property Index, and Indexed Skyline.</desc>
  <rect width="1200" height="720" fill="#F7F5F0"/>
  <text x="72" y="88" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">RealRank icon directions</text>
  <text x="72" y="130" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="22">Index + real estate, reduced to a clear small-size silhouette</text>

  <g transform="translate(72 190)">
    <rect width="320" height="430" rx="28" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <g transform="translate(80 42) scale(2.5)">
      <path fill="#0F3D2E" d="M32 3C17.7 3 7 13.1 7 27.1 7 43.2 27.2 59 30.7 61.6a2.2 2.2 0 0 0 2.6 0C36.8 59 57 43.2 57 27.1 57 13.1 46.3 3 32 3Z"/>
      <circle cx="20" cy="20" r="3" fill="#C65D2E"/>
      <circle cx="20" cy="29" r="3" fill="#F7F5F0"/>
      <circle cx="20" cy="38" r="3" fill="#F7F5F0"/>
      <path fill="#F7F5F0" d="M27 17h17a3 3 0 0 1 0 6H27a3 3 0 0 1 0-6Zm0 9h13a3 3 0 0 1 0 6H27a3 3 0 0 1 0-6Zm0 9h9a3 3 0 0 1 0 6h-9a3 3 0 0 1 0-6Z"/>
    </g>
    <text x="28" y="258" fill="#C65D2E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">RECOMMENDED</text>
    <text x="28" y="298" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Ranked Address</text>
    <text x="28" y="333" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">A location marker containing</text>
    <text x="28" y="358" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">an ordered company index.</text>
    <g transform="translate(28 382)">
      <rect width="32" height="32" rx="7" fill="#F7F5F0"/>
      <g transform="translate(4 3) scale(.375)">
        <path fill="#0F3D2E" d="M32 3C17.7 3 7 13.1 7 27.1 7 43.2 27.2 59 30.7 61.6a2.2 2.2 0 0 0 2.6 0C36.8 59 57 43.2 57 27.1 57 13.1 46.3 3 32 3Z"/>
        <circle cx="20" cy="20" r="3" fill="#C65D2E"/>
        <circle cx="20" cy="29" r="3" fill="#F7F5F0"/>
        <circle cx="20" cy="38" r="3" fill="#F7F5F0"/>
        <path fill="#F7F5F0" d="M27 17h17a3 3 0 0 1 0 6H27a3 3 0 0 1 0-6Zm0 9h13a3 3 0 0 1 0 6H27a3 3 0 0 1 0-6Zm0 9h9a3 3 0 0 1 0 6h-9a3 3 0 0 1 0-6Z"/>
      </g>
      <text x="44" y="22" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">32 px check</text>
    </g>
  </g>

  <g transform="translate(440 190)">
    <rect width="320" height="430" rx="28" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <g transform="translate(80 42) scale(2.5)">
      <rect x="5" y="5" width="54" height="54" rx="14" fill="#0F3D2E"/>
      <path d="M17 25 32 14l15 11" fill="none" stroke="#F7F5F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 23v7h24v-7" fill="none" stroke="#F7F5F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="19" cy="40" r="3" fill="#C65D2E"/>
      <circle cx="19" cy="49" r="3" fill="#F7F5F0"/>
      <path d="M27 40h18M27 49h13" fill="none" stroke="#F7F5F0" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="28" y="298" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Property Index</text>
    <text x="28" y="333" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">A directory card topped by a</text>
    <text x="28" y="358" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">recognizable property roof.</text>
    <text x="28" y="403" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">Most literal · easiest to understand</text>
  </g>

  <g transform="translate(808 190)">
    <rect width="320" height="430" rx="28" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="2"/>
    <g transform="translate(80 42) scale(2.5)">
      <rect x="5" y="5" width="54" height="54" rx="14" fill="#0F3D2E"/>
      <path fill="#F7F5F0" d="M13 35a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v15H13V35Zm12-10a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v25H25V25Zm12-10a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v35H37V15Z"/>
      <path fill="#C65D2E" d="M11 47h42a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3v-1a3 3 0 0 1 3-3Z"/>
      <path fill="#0F3D2E" d="M17 37h6v4h-6zm12-10h6v4h-6zm12-10h6v4h-6z"/>
    </g>
    <text x="28" y="298" fill="#14110F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Indexed Skyline</text>
    <text x="28" y="333" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">Ordered listing columns become</text>
    <text x="28" y="358" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="17">a rising real-estate skyline.</text>
    <text x="28" y="403" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="14">Most competitive · strongest “rank” cue</text>
  </g>

  <text x="72" y="678" fill="#5C574E" font-family="Inter, Arial, sans-serif" font-size="16">Palette: forest #0F3D2E · terracotta #C65D2E · warm cream #F7F5F0</text>
</svg>
