<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">RealRank property index lens draft</title>
  <desc id="desc">A rounded property index with three consistently aligned square items, a highlighted first rank, and a magnifying lens containing a lightly detailed property silhouette.</desc>
  <rect width="720" height="640" fill="#F7F5F0"/>

  <!-- Index frame -->
  <rect x="45" y="45" width="460" height="460" rx="80" fill="none" stroke="#0F3D2E" stroke-width="50"/>

  <!-- Three consistently aligned ranked items -->
  <rect x="110" y="110" width="80" height="80" rx="22" fill="#C65D2E"/>
  <rect x="110" y="220" width="80" height="80" rx="22" fill="#0F3D2E"/>
  <rect x="110" y="330" width="80" height="80" rx="22" fill="#0F3D2E"/>
  <path d="M240 150h190M240 260h150M240 370h100" fill="none" stroke="#0F3D2E" stroke-width="50" stroke-linecap="round"/>

  <!-- Search lens -->
  <circle cx="460" cy="400" r="170" fill="#F7F5F0" stroke="#0F3D2E" stroke-width="50"/>
  <path d="m580 520 100 90" fill="none" stroke="#0F3D2E" stroke-width="70" stroke-linecap="round"/>

  <!-- Premium layered real-estate cluster -->
  <path fill="#0F3D2E" d="M342 486V386l45-24 40 22v102h-85Z"/>
  <path fill="#0F3D2E" d="M414 486V318l43-25 43 25v168h-86Z"/>
  <path fill="#0F3D2E" d="M488 486V376l39-23 45 24v109h-84Z"/>

  <!-- Restrained tower windows -->
  <g fill="#F7F5F0">
    <rect x="358" y="394" width="15" height="18" rx="3"/>
    <rect x="382" y="386" width="15" height="18" rx="3"/>
    <rect x="358" y="420" width="15" height="18" rx="3"/>
    <rect x="382" y="412" width="15" height="18" rx="3"/>
    <rect x="358" y="446" width="15" height="18" rx="3"/>
    <rect x="382" y="438" width="15" height="18" rx="3"/>
    <path d="M435 337h14v83l-14 10v-93Zm28-10h14v73l-14 10v-83Z"/>
    <rect x="516" y="389" width="36" height="10" rx="3"/>
    <rect x="516" y="414" width="36" height="10" rx="3"/>
    <rect x="516" y="439" width="36" height="10" rx="3"/>
  </g>

  <!-- Foreground house shares the skyline geometry -->
  <path d="m378 456 79-61 79 61" fill="none" stroke="#F7F5F0" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M390 449v38h134v-38" fill="none" stroke="#F7F5F0" stroke-width="17" stroke-linejoin="round"/>
  <g fill="#F7F5F0">
    <rect x="426" y="444" width="18" height="18" rx="3"/>
    <rect x="452" y="444" width="18" height="18" rx="3"/>
    <rect x="426" y="470" width="18" height="16" rx="3"/>
    <rect x="452" y="470" width="18" height="16" rx="3"/>
  </g>
</svg>
